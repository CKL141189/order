services:
  - type: web
    name: order-sorter
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DB_PATH
        value: /data/orders.db
    disk:
      name: orders-data
      mountPath: /data
      sizeGB: 1
