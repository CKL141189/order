<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>訂單列表</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Microsoft JhengHei", Arial, sans-serif; background: #f0f2f5; color: #333; }
.container { max-width: 1100px; margin: 30px auto; padding: 0 20px 60px; }
.order-pagination { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 12px 0; font-size: 0.85rem; }
.page-controls { display: flex; align-items: center; gap: 8px; }
.page-controls button { width: 36px; height: 36px; border: 1px solid #ccc; border-radius: 5px; background: #fff; cursor: pointer; font-size: 1.25rem; }
.page-controls button:disabled { opacity: 0.4; cursor: default; }
.page-input { width: 64px; height: 36px; padding: 4px; border: 1px solid #ccc; border-radius: 5px; font: inherit; }
.list-status { padding: 12px 0; color: #666; }
.list-status.hidden, #listRetry.hidden { display: none; }
#orderGrid[aria-busy="true"] { opacity: 0.45; }

/* Nav */
.nav-bar { display: flex; align-items: center; margin-bottom: 24px; gap: 10px; }
.nav-bar h1 { font-size: 1.6rem; color: #2c3e50; flex: 1; text-align: center; margin: 0; }
.btn-nav { padding: 8px 18px; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 0.9rem; font-family: inherit; text-decoration: none; display: inline-block; transition: background 0.2s; white-space: nowrap; }
.btn-nav.blue { background: #4a90e2; }
.btn-nav.blue:hover { background: #357abd; }
.btn-nav.green { background: #27ae60; }
.btn-nav.green:hover { background: #1e8449; }
.btn-nav.red { background: #e74c3c; }
.btn-nav.red:hover { background: #c0392b; }

/* Date Tabs */
.tabs-bar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
.tab-btn {
  padding: 7px 16px; border: 2px solid #ddd; border-radius: 20px;
  background: #fff; cursor: pointer; font-size: 0.88rem; font-family: inherit;
  transition: all 0.15s; white-space: nowrap;
}
.tab-btn:hover { border-color: #4a90e2; color: #4a90e2; }
.tab-btn.active { background: #4a90e2; border-color: #4a90e2; color: #fff; font-weight: bold; }
.tab-count { font-size: 0.78rem; opacity: 0.85; margin-left: 4px; }
.tab-btn.date-tab-btn { display: flex; flex-direction: column; align-items: center; white-space: normal; padding: 6px 12px; text-align: center; }
.tab-sub { font-size: 0.62rem; display: flex; gap: 4px; margin-top: 2px; min-height: 0.85em; }
.sub-inv { color: #e67e22; font-weight: bold; }
.sub-lux { color: #8e44ad; font-weight: bold; }
.sub-svc { color: #27ae60; font-weight: bold; }
.tab-btn.active .sub-inv, .tab-btn.active .sub-lux, .tab-btn.active .sub-svc { color: rgba(255,255,255,0.9); }

/* View Toggle */
.view-toggle-bar { display: flex; gap: 8px; margin-bottom: 16px; align-items: center; flex-wrap: wrap; }
.view-toggle-bar span { font-size: 0.85rem; color: #888; margin-right: 4px; }
.toggle-group { display: flex; align-items: center; gap: 8px; }
.toggle-group-sep { width: 1px; background: #ddd; height: 20px; margin: 0 4px; flex-shrink: 0; }
.btn-view {
  padding: 6px 18px; border: 2px solid #ddd; border-radius: 20px;
  background: #fff; cursor: pointer; font-size: 0.88rem; font-family: inherit; transition: all 0.15s;
}
.btn-view:hover { border-color: #27ae60; color: #27ae60; }
.btn-view.active { background: #27ae60; border-color: #27ae60; color: #fff; font-weight: bold; }

/* Simple card view */
.card-simple { padding: 11px 14px; background: #f8fafb; border-bottom: 1px solid #eef2f7; word-break: break-all; cursor: pointer; }
.card-simple.hidden { display: none; }
.simple-l1 { font-size: 0.93rem; font-weight: bold; color: #2c3e50; line-height: 1.5; }
.simple-l2 { font-size: 0.9rem; color: #e67e22; margin-top: 4px; }
.simple-l3 { font-size: 0.85rem; color: #e74c3c; margin-top: 3px; }

/* Toolbar */
.toolbar {
  display: flex; flex-direction: column; gap: 6px;
  background: #fff; border-radius: 8px; padding: 10px 14px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.08); margin-bottom: 16px;
}
.toolbar-row1, .toolbar-row2 { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.toolbar .sel-info { color: #666; font-size: 0.9rem; }
.toolbar .sel-info span { font-weight: bold; color: #2c3e50; }
.btn-sm { padding: 6px 14px; font-size: 0.85rem; border-radius: 5px; border: none; cursor: pointer; font-family: inherit; }
.btn-selall { background: #f0f0f0; color: #444; }
.btn-selall:hover { background: #e0e0e0; }
.btn-share { background: #27ae60; color: #fff; }
.btn-share:hover { background: #1e8449; }
.btn-share:disabled { background: #a8d5b5; cursor: not-allowed; }
.btn-assign-bulk { background: #e67e22; color: #fff; }
.btn-assign-bulk:hover:not(:disabled) { background: #cf6d17; }
.btn-assign-bulk:disabled { background: #f0c090; cursor: not-allowed; }
.btn-copy-bulk { background: #4a90e2; color: #fff; }
.btn-copy-bulk:hover:not(:disabled) { background: #357abd; }
.btn-copy-bulk:disabled { background: #b0c8e8; cursor: not-allowed; }
.btn-share-bulk { background: #27ae60; color: #fff; }
.btn-share-bulk:hover:not(:disabled) { background: #1e8449; }
.btn-share-bulk:disabled { background: #a8d5b5; cursor: not-allowed; }
.btn-delete-bulk { background: #e74c3c; color: #fff; }
.btn-delete-bulk:hover:not(:disabled) { background: #c0392b; }
.btn-delete-bulk:disabled { background: #f0a8a0; cursor: not-allowed; }
.toolbar-divider { width: 1px; height: 22px; background: #ddd; flex-shrink: 0; }
.toolbar-group-label { font-size: 0.8rem; color: #999; white-space: nowrap; }
.btn-no-driver {
  border: none; background: none; cursor: pointer; font-size: 0.8rem;
  color: #aaa; padding: 6px 14px; width: 50%; text-align: left;
  font-family: inherit; border-top: 1px solid #f0f0f0; border-left: 1px solid #f0f0f0;
}
.btn-no-driver:hover { background: #f9f9f9; color: #95a5a6; }
.card-footer-btns { display: flex; }
.card-created { font-size: 0.75rem; color: #bbb; padding: 3px 14px 7px; text-align: right; }

/* Search bar */
.search-bar { margin-bottom: 16px; }
.search-input-wrap {
  position: relative; display: inline-flex; align-items: center;
  width: 260px; max-width: 100%;
}
.search-input-wrap input {
  width: 100%; padding: 8px 32px 8px 16px; border: 1px solid #ddd; border-radius: 20px;
  font-size: 0.88rem; font-family: inherit; background: #fff;
}
.search-input-wrap input:focus { outline: none; border-color: #4a90e2; }
.btn-search-clear {
  position: absolute; right: 12px;
  border: none; background: none; color: #bbb; cursor: pointer;
  font-size: 0.9rem; padding: 0; line-height: 1; font-family: inherit;
}
.btn-search-clear:hover { color: #555; }

/* Grid */
.order-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 16px; }
.order-card {
  background: #fff; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  overflow: hidden; transition: box-shadow 0.2s, transform 0.15s;
  position: relative; cursor: pointer;
}
.order-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.13); }
.order-card.selected { box-shadow: 0 0 0 3px #e74c3c; }
.order-card.hidden { display: none; }

.card-checkbox { width: 17px; height: 17px; accent-color: #4a90e2; cursor: pointer; flex-shrink: 0; }
.card-header .card-checkbox { accent-color: #e74c3c; }
.card-header { background: #4a90e2; color: #fff; padding: 8px 14px; display: flex; flex-direction: column; gap: 3px; }
.card-header-main { display: flex; align-items: center; width: 100%; gap: 4px; }
.card-header-actions { display: flex; gap: 6px; margin-left: auto; flex-shrink: 0; }
.card-header .order-no { font-weight: bold; font-size: 0.88rem; flex: 1; display: flex; align-items: center; flex-wrap: nowrap; gap: 4px; overflow: hidden; }
.card-header .date-time { font-size: 0.85rem; opacity: 0.92; }
.card-header-tags { display: flex; gap: 4px; }
.chtag { font-size: 0.62rem; padding: 1px 6px; border-radius: 3px; font-weight: bold; white-space: nowrap; border: 1px solid rgba(255,255,255,0.6); color: #fff; }
.chtag.inv { background: rgba(211,84,0,0.9); }
.chtag.lux { background: rgba(142,68,173,0.9); }
.chtag.svc { background: rgba(22,160,133,0.9); }
.btn-card-action {
  border: 1px solid rgba(255,255,255,0.55); background: rgba(255,255,255,0.15);
  color: #fff; padding: 5px 13px; border-radius: 4px; cursor: pointer;
  font-size: 0.85rem; font-family: inherit; white-space: nowrap; transition: background 0.15s;
}
.btn-card-action:hover { background: rgba(255,255,255,0.32); }
.btn-card-action.done { background: rgba(255,255,255,0.45); }

/* Date range panel */
.date-range-panel {
  background: #fff; border: 1px solid #e0e0e0; border-radius: 8px;
  padding: 10px 16px; margin-bottom: 16px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
}
.date-range-panel.hidden { display: none; }
.cal-nav { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.cal-nav-btn { background: #f0f0f0; border: none; border-radius: 5px; width: 28px; height: 28px; cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center; }
.cal-nav-btn:hover { background: #d0e4f7; }
.cal-title { font-weight: bold; font-size: 0.95rem; color: #2c3e50; min-width: 100px; text-align: center; }
.cal-weekdays, .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; width: 100%; }
.cal-weekdays span { font-size: 0.75rem; color: #999; text-align: center; padding: 3px 0; }
.cal-day { width: 100%; min-height: 68px; border: none; background: #f5f5f5; border-radius: 4px; cursor: pointer; font-size: 0.83rem; font-family: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 4px 2px; }
.cal-day:hover:not(.empty) { background: #d0e4f7; }
.cal-day.empty { background: transparent; cursor: default; }
.cal-day.today { border: 2px solid #4a90e2; font-weight: bold; }
.cal-day.sel-start, .cal-day.sel-end { background: #4a90e2; color: #fff; font-weight: bold; }
.cal-day.in-range { background: #cce0f5; }
.cal-count { font-size: 0.68rem; color: #4a90e2; line-height: 1.2; font-weight: bold; }
.cal-day.sel-start .cal-count, .cal-day.sel-end .cal-count { color: rgba(255,255,255,0.85); }
.cal-day.in-range .cal-count { color: #4a90e2; }
.cal-sub { font-size: 0.6rem; display: flex; gap: 3px; justify-content: center; line-height: 1.2; min-height: 0.85em; flex-wrap: wrap; }
.cal-day.sel-start .cal-sub .sub-inv, .cal-day.sel-end .cal-sub .sub-inv,
.cal-day.sel-start .cal-sub .sub-lux, .cal-day.sel-end .cal-sub .sub-lux,
.cal-day.sel-start .cal-sub .sub-svc, .cal-day.sel-end .cal-sub .sub-svc { color: rgba(255,255,255,0.85); }
.cal-range-info { display: flex; align-items: center; gap: 10px; margin-top: 8px; font-size: 0.85rem; color: #555; }
.btn-range-clear { background: #e0e0e0; color: #555; padding: 4px 12px; border: none; border-radius: 5px; cursor: pointer; font-size: 0.82rem; font-family: inherit; }
.btn-range-clear:hover { background: #c8c8c8; }

/* Edit modal */
.edit-field-row { margin-bottom: 12px; }
.edit-field-row label { display: block; font-size: 0.8rem; color: #888; margin-bottom: 4px; }
.edit-field-row input, .edit-field-row textarea {
  width: 100%; padding: 7px 10px; border: 1px solid #ddd; border-radius: 5px;
  font-size: 0.9rem; font-family: inherit; box-sizing: border-box;
}
.edit-field-row input:focus, .edit-field-row textarea:focus { outline: none; border-color: #4a90e2; }
.edit-field-row textarea { height: 70px; resize: vertical; }
.btn-save { background: #4a90e2; color: #fff; }
.btn-save:hover { background: #357abd; }
.order-card.is-pickup .card-header { background: #27ae60; }
.order-card.has-driver .card-driver { background: #fdecea; border-color: #f5c6cb; }
.order-card.has-driver .driver-label { color: #e74c3c; }
.order-card.conflict { opacity: 0.5; filter: grayscale(50%); cursor: pointer; }
.order-card.conflict .card-header { background: #95a5a6 !important; }

.card-driver {
  border-top: 1px solid #e8f5e9; background: #f1f8f1;
  padding: 8px 14px; display: flex; align-items: center; gap: 8px; font-size: 0.88rem;
}
.card-driver.hidden { display: none; }
.card-body.hidden { display: none; }
.simple-hidden { display: none !important; }
.driver-label { color: #27ae60; font-weight: bold; white-space: nowrap; }
.driver-name { color: #2c3e50; flex: 1; }
.btn-driver-edit, .btn-driver-del {
  border: none; background: none; cursor: pointer; font-size: 0.82rem;
  padding: 3px 7px; border-radius: 4px; font-family: inherit;
}
.btn-driver-edit { color: #4a90e2; }
.btn-driver-edit:hover { background: #e3f0fc; }
.btn-driver-del { color: #e74c3c; }
.btn-driver-del:hover { background: #fdecea; }
.btn-assign-driver {
  border: none; background: none; cursor: pointer; font-size: 0.8rem;
  color: #aaa; padding: 6px 14px; width: 100%; text-align: left;
  font-family: inherit; border-top: 1px solid #f0f0f0;
}
.btn-assign-driver:hover { background: #f9f9f9; color: #27ae60; }
.card-body { padding: 12px 14px; }
.field-row { display: flex; margin-bottom: 6px; font-size: 0.88rem; line-height: 1.4; }
.field-label { color: #999; min-width: 68px; flex-shrink: 0; }
.field-value { color: #222; word-break: break-all; }
.field-value.highlight { color: #e67e22; font-weight: bold; }

.no-data { text-align: center; color: #aaa; padding: 60px 0; font-size: 1rem; }
.no-data a { color: #4a90e2; text-decoration: none; }
.no-data a:hover { text-decoration: underline; }

/* Share Modal */
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.45); z-index: 100; align-items: center; justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal {
  background: #fff; border-radius: 12px; width: 90%; max-width: 560px;
  max-height: 85vh; display: flex; flex-direction: column; overflow: hidden;
  box-shadow: 0 8px 32px rgba(0,0,0,0.2);
}
.modal-header { padding: 16px 20px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
.modal-header h2 { font-size: 1.1rem; color: #2c3e50; }
.modal-close { background: none; border: none; font-size: 1.4rem; cursor: pointer; color: #aaa; padding: 0 4px; }
.modal-close:hover { color: #555; }
.modal-body { padding: 16px 20px; flex: 1; overflow-y: auto; }
.driver-row { display: flex; gap: 10px; margin-bottom: 14px; align-items: center; }
.driver-row label { font-weight: bold; white-space: nowrap; color: #555; }
.driver-row input { flex: 1; padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 0.95rem; font-family: inherit; }
.driver-row input:focus { outline: none; border-color: #4a90e2; }
.share-text {
  width: 100%; height: 320px; padding: 10px; border: 1px solid #ddd; border-radius: 6px;
  font-size: 0.88rem; font-family: "Microsoft JhengHei", monospace; resize: none;
  line-height: 1.6; background: #fafafa;
}
.modal-footer { padding: 12px 20px; border-top: 1px solid #eee; display: flex; gap: 10px; justify-content: flex-end; }
.btn-regen { background: #4a90e2; color: #fff; }
.btn-regen:hover { background: #357abd; }
.btn-copy { background: #27ae60; color: #fff; }
.btn-copy:hover { background: #1e8449; }
.btn-copy.copied { background: #95a5a6; }
button { padding: 9px 22px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.95rem; font-family: inherit; transition: background 0.2s; }

/* Internal note */
.card-note { padding: 6px 14px 8px; }
.card-note.hidden { display: none; }
.note-input {
  width: 100%; border: 1px solid #e8e8e8; border-radius: 5px;
  padding: 6px 10px; font-size: 0.82rem; font-family: inherit;
  resize: none; height: 52px; color: #555; background: #fafafa;
  transition: border-color 0.15s; line-height: 1.5;
}
.note-input:focus { outline: none; border-color: #f39c12; background: #fff; }
.note-input::placeholder { color: #ccc; }
.note-badge {
  display: inline-block; color: #fff; flex-shrink: 0;
  font-size: 0.62rem; padding: 1px 5px; border-radius: 3px;
  font-weight: bold; letter-spacing: 0.03em; white-space: nowrap;
  border: 1px solid rgba(255,255,255,0.6);
}
.note-badge.priv { background: #e67e22; }
.note-badge.pub  { background: #16a085; }
.note-badge.hidden { display: none; }

/* Peek detail button in simple view */
.simple-l2-row { display: flex; align-items: center; margin-top: 4px; gap: 6px; }
.simple-l2-row .simple-l2 { margin-top: 0; flex: 1; }
.btn-peek-detail {
  flex-shrink: 0; background: none; border: 1px solid #d0e4f5; border-radius: 10px;
  color: #a0bcd8; font-size: 0.72rem; font-family: inherit; cursor: pointer;
  padding: 2px 10px; transition: all 0.15s;
}
.btn-peek-detail:hover { border-color: #4a90e2; color: #4a90e2; }

@media (max-width: 640px) {
  .container { margin: 10px auto; padding: 0 10px 60px; }

  /* Nav: title on top, buttons below */
  .nav-bar { flex-wrap: wrap; justify-content: center; gap: 6px; margin-bottom: 14px; }
  .nav-bar h1 { width: 100%; order: -1; font-size: 1.2rem; text-align: center; }
  .btn-nav { padding: 6px 12px; font-size: 0.82rem; }

  /* Date tabs */
  .tabs-bar { gap: 5px; }
  .tab-btn { padding: 6px 10px; font-size: 0.82rem; }

  /* Sort/View toggles: stack to 2 rows on mobile */
  .view-toggle-bar { flex-direction: column; align-items: flex-start; gap: 6px; }
  .toggle-group-sep { display: none; }
  .btn-view { padding: 5px 10px; font-size: 0.82rem; }

  /* Search */
  .search-bar input { font-size: 0.88rem; }

  /* Toolbar */
  .toolbar { gap: 5px; padding: 8px 10px; }
  .btn-sm { padding: 5px 10px; font-size: 0.8rem; }

  /* Single column cards */
  .order-grid { grid-template-columns: 1fr; gap: 10px; }

  /* Calendar */
  .cal-day { min-height: 70px; font-size: 0.8rem; }
}
</style>
</head>
<body>
<div class="container">

  <div class="nav-bar">
    <a href="/add" class="btn-nav blue">← 新增訂單</a>
    <h1>訂單列表</h1>
    <div style="display:flex; gap:8px; align-items:center;">
      <a href="/deleted" class="btn-nav" style="background:#95a5a6;">刪除紀錄</a>
      <a href="/stats" class="btn-nav green">司機統計 →</a>
    </div>
  </div>

  <!-- Sort + View Toggle -->
  <div class="view-toggle-bar">
    <div class="toggle-group">
      <span>排序：</span>
      <button class="btn-view btn-sort-opt active" onclick="switchSort('date', this)">依預約日期</button>
      <button class="btn-view btn-sort-opt" onclick="switchSort('created', this)">依建立時間</button>
    </div>
    <div class="toggle-group-sep"></div>
    <div class="toggle-group">
      <span>顯示：</span>
      <button class="btn-view active" data-view="detailed" onclick="switchView('detailed', this)">詳細訂單</button>
      <button class="btn-view" data-view="simple" onclick="switchView('simple', this)">簡易訂單</button>
    </div>
  </div>

  <!-- Date Tabs -->
  <div class="tabs-bar" id="tabsBar">
    {% set yesterday = date_tabs[0] %}
    <button class="tab-btn date-tab-btn" data-tab="{{ yesterday.date_key }}" onclick="switchTab('{{ yesterday.date_key }}', this)">
      <span>{{ yesterday.label }} {{ yesterday.display }} <span class="tab-count"></span></span>
      <span class="tab-sub"></span>
    </button>
    {% for tab in date_tabs[1:] %}
    <button class="tab-btn date-tab-btn{% if loop.first %} active{% endif %}" data-tab="{{ tab.date_key }}" onclick="switchTab('{{ tab.date_key }}', this)">
      <span>{{ tab.label }} {{ tab.display }} <span class="tab-count"></span></span>
      <span class="tab-sub"></span>
    </button>
    {% endfor %}
    <button class="tab-btn date-tab-btn" data-tab="custom" onclick="switchTab('custom', this)">
      <span>自訂區間 <span class="tab-count" id="cnt-custom"></span></span>
      <span class="tab-sub" id="tsub-custom"></span>
    </button>
  </div>

  <!-- Date Range Calendar -->
  <div class="date-range-panel hidden" id="dateRangePanel">
    <div class="cal-nav">
      <button class="cal-nav-btn" onclick="calPrevMonth()">‹</button>
      <span class="cal-title" id="calTitle"></span>
      <button class="cal-nav-btn" onclick="calNextMonth()">›</button>
    </div>
    <div class="cal-weekdays">
      <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="cal-range-info">
      <span id="calRangeText">點選開始日期</span>
      <button class="btn-range-clear" onclick="clearDateRange()">清除</button>
    </div>
  </div>

  <!-- Driver Filter -->

<script>
let currentTab = "{{ date_tabs[1].date_key }}";
let currentDriverFilter = "all";
let currentView = "detailed";
let currentInvoiceFilter = false;
let currentLuxuryFilter = false;
let currentSvcFilter = false;
let dateRangeFrom = null;
let dateRangeTo = null;
let currentPage = 1;
let totalPages = 1;
let pageTotal = 0;
let scopeCounts = null;
let dateSummaries = null;
let summaryCache = {};
let listRequestId = 0;
let listController = null;
let summaryRequestId = 0;
let summaryController = null;
let searchTimer = null;
let refreshTimer = null;
let listBusy = false;

function dateToNum(s) {
  if (!s) return null;
  const m = String(s).match(/(\d{1,2})\s*[／/]\s*(\d{1,2})/);
  if (!m) return null;
  const p = [Number(m[1]), Number(m[2])];
  return p.length === 2 && !isNaN(p[0]) && !isNaN(p[1]) ? p[0] * 100 + p[1] : null;
}

function normalizeDateKey(s) {
  const m = String(s || "").match(/(\d{1,2})\s*[／/]\s*(\d{1,2})/);
  return m ? `${parseInt(m[1])}/${parseInt(m[2])}` : (s || "");
}

function getCreatedDateKey(card) {
  const created = card.dataset.created || "";
  const m = created.match(/\d{4}\/(\d{1,2})\/(\d{1,2})/);
  return m ? `${parseInt(m[1])}/${parseInt(m[2])}` : "";
}

// ── Calendar ──
let calYear = new Date().getFullYear();
let calMonth = new Date().getMonth() + 1;
let calRangeStart = null;
let calRangeEnd = null;

function buildDateCountMaps() {
  const total = {}, inv = {}, lux = {}, svc = {};
  for (const row of dateSummaries || []) {
    total[row.date] = row.total;
    inv[row.date] = row.invoice;
    lux[row.date] = row.luxury;
    svc[row.date] = row.svc;
  }
  return { total, inv, lux, svc };
}

function makeSubHtml(i, l, s) {
  const parts = [];
  if (i) parts.push(`<span class="sub-inv">票${i}</span>`);
  if (l) parts.push(`<span class="sub-lux">車${l}</span>`);
  if (s) parts.push(`<span class="sub-svc">單${s}</span>`);
  return parts.join("");
}

function renderCalendar() {
  const y = calYear, m = calMonth;
  document.getElementById("calTitle").textContent = `${y}年 ${m}月`;
  const firstDow = new Date(y, m - 1, 1).getDay();
  const totalDays = new Date(y, m, 0).getDate();
  const today = new Date();
  const grid = document.getElementById("calGrid");
  const { total: dateCountMap, inv: invMap, lux: luxMap, svc: svcMap } = buildDateCountMaps();
  grid.innerHTML = "";
  for (let i = 0; i < firstDow; i++) {
    const el = document.createElement("div"); el.className = "cal-day empty"; grid.appendChild(el);
  }
  for (let d = 1; d <= totalDays; d++) {
    const btn = document.createElement("button");
    btn.className = "cal-day";
    const key = m * 100 + d;
    const cnt = dateCountMap[key] || 0;
    const invC = invMap[key] || 0, luxC = luxMap[key] || 0, svcC = svcMap[key] || 0;
    const subHtml = makeSubHtml(invC, luxC, svcC);
    btn.innerHTML = `<span>${d}</span>` +
      `<span class="cal-count"${dateSummaries && !cnt ? ' style="opacity:0"' : ''}>${dateSummaries ? (cnt || '') : '…'}</span>` +
      `<span class="cal-sub"${!subHtml ? ' style="visibility:hidden"' : ''}>${subHtml || '&nbsp;'}</span>`;
    if (y === today.getFullYear() && m === today.getMonth() + 1 && d === today.getDate())
      btn.classList.add("today");
    const n = y * 10000 + m * 100 + d;
    const sn = calRangeStart ? calRangeStart.year * 10000 + calRangeStart.month * 100 + calRangeStart.day : null;
    const en = calRangeEnd   ? calRangeEnd.year   * 10000 + calRangeEnd.month   * 100 + calRangeEnd.day   : null;
    if (sn && n === sn) btn.classList.add("sel-start");
    if (en && n === en) btn.classList.add("sel-end");
    if (sn && en && n > sn && n < en) btn.classList.add("in-range");
    btn.onclick = () => calSelectDay(y, m, d);
    grid.appendChild(btn);
  }
  const txt = document.getElementById("calRangeText");
  if (!calRangeStart) txt.textContent = "點選開始日期";
  else if (!calRangeEnd) txt.textContent = `${calRangeStart.month}/${calRangeStart.day} — 再點結束日期（可點同一天）`;
  else txt.textContent = `${calRangeStart.month}/${calRangeStart.day} — ${calRangeEnd.month}/${calRangeEnd.day}`;
}

function calSelectDay(y, m, d) {
  const n = y * 10000 + m * 100 + d;
  const sn = calRangeStart ? calRangeStart.year * 10000 + calRangeStart.month * 100 + calRangeStart.day : null;
  if (!calRangeStart || calRangeEnd || (sn && n < sn)) {
    calRangeStart = { year: y, month: m, day: d }; calRangeEnd = null;
    dateRangeFrom = null; dateRangeTo = null;
  } else {
    calRangeEnd = { year: y, month: m, day: d };
    dateRangeFrom = `${calRangeStart.month}/${calRangeStart.day}`;
    dateRangeTo   = `${calRangeEnd.month}/${calRangeEnd.day}`;
    applyFilters();
  }
  renderCalendar();
}

function calPrevMonth() { calMonth--; if (calMonth < 1) { calMonth = 12; calYear--; } renderCalendar(); }
function calNextMonth() { calMonth++; if (calMonth > 12) { calMonth = 1; calYear++; } renderCalendar(); }

function clearDateRange() {
  calRangeStart = null; calRangeEnd = null;
  dateRangeFrom = null; dateRangeTo = null;
  renderCalendar(); applyFilters();
}

// ── Edit Modal ──
let editingCardEl = null;

function openEditModal(btn, event) {
  event.stopPropagation();
  editingCardEl = btn.closest(".order-card");
  const data = getOrderData(editingCardEl);
  const container = document.getElementById("editFields");
  container.innerHTML = "";
  const multiLine = new Set(["連繫地址", "接送地址", "先到地址", "加點地址", "接送順序", "出發地址", "抵達地址", "備註"]);
  FIELDS_ORDER.forEach(f => {
    const row = document.createElement("div");
    row.className = "edit-field-row";
    const val = (data[f] || "").replace(/"/g, "&quot;");
    if (multiLine.has(f)) {
      row.innerHTML = `<label>${f}</label><textarea name="${f}">${data[f] || ""}</textarea>`;
    } else {
      row.innerHTML = `<label>${f}</label><input type="text" name="${f}" value="${val}">`;
    }
    container.appendChild(row);
  });
  document.getElementById("editModal").classList.add("open");
}

function closeEditModal() { document.getElementById("editModal").classList.remove("open"); }
function closeEditOnOverlay(e) { if (e.target === document.getElementById("editModal")) closeEditModal(); }

async function postJson(url, payload) {
  const resp = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  });
  const data = await resp.json().catch(() => ({}));
  if (!resp.ok || !data.ok) throw new Error(data.error || "save_failed");
  return data;
}

async function saveOrder() {
  const card = editingCardEl;
  const newData = {};
  document.querySelectorAll("#editFields [name]").forEach(el => { newData[el.name] = el.value.trim(); });
  const btn = document.querySelector("#editModal .btn-save");
  const originalText = btn ? btn.textContent : "";
  if (btn) { btn.disabled = true; btn.textContent = "儲存中..."; }
  try {
    const res = await postJson(`/api/orders/${card.dataset.id}`, newData);
    updateCardDOM(card, res.order || newData);
    closeEditModal();
  } catch (err) {
    alert("訂單內容儲存失敗，請再試一次。");
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = originalText || "儲存"; }
  }
}

function updateInvoiceBadge(card, data) {
  const invoiceText = [data["備註"] || "", data["付費方式"] || ""].join(" ");
  const hasInvoice = /發票|統編|統一編號/.test(invoiceText);
  card.dataset.hasInvoice = hasInvoice ? "yes" : "no";
  let tags = card.querySelector(".card-header-tags");
  const badge = tags && tags.querySelector(".chtag.inv");
  if (hasInvoice && !badge) {
    if (!tags) {
      tags = document.createElement("div");
      tags.className = "card-header-tags";
      card.querySelector(".card-header").appendChild(tags);
    }
    const invoiceBadge = document.createElement("span");
    invoiceBadge.className = "chtag inv";
    invoiceBadge.textContent = "發票";
    tags.prepend(invoiceBadge);
  } else if (!hasInvoice && badge) {
    badge.remove();
    if (!tags.children.length) tags.remove();
  }
}

function updateCardDOM(card, data) {
  const script = card.querySelector(".order-data");
  const merged = { ...getOrderData(card), ...data };
  script.textContent = JSON.stringify(merged);
  const orderNoEl = card.querySelector(".order-no");
  const orderNoText = orderNoEl.querySelector(".order-no-text");
  if (orderNoText) orderNoText.textContent = data["訂單號碼"] || "—";
  const pubBadge = orderNoEl.querySelector(".note-badge.pub");
  if (pubBadge) pubBadge.classList.toggle("hidden", !merged["備註"]);
  const dtEl = card.querySelector(".date-time"); if (dtEl) dtEl.textContent = data["預約日期"] || "";
  card.dataset.date = normalizeDateKey(data["預約日期"] || "");
  card.dataset.search = `${merged["訂單號碼"] || ""} ${merged["聯絡電話"] || ""}`;
  const tabBtns = document.querySelectorAll(".date-tab-btn[data-tab]");
  let newTab = "其他";
  tabBtns.forEach(b => { if (b.dataset.tab === card.dataset.date) newTab = card.dataset.date; });
  card.dataset.tab = newTab;
  const skip = new Set(["訂單號碼"]);
  const body = card.querySelector(".card-body");
  body.innerHTML = "";
  FIELDS_ORDER.forEach(f => {
    if (!skip.has(f) && merged[f]) {
      const row = document.createElement("div");
      row.className = "field-row";
      row.innerHTML = `<span class="field-label">${f}</span><span class="field-value${f === "付費方式" ? " highlight" : ""}">${merged[f]}</span>`;
      body.appendChild(row);
    }
  });
  const { line1, line2, line3 } = generateSimpleParts(merged);
  card.querySelector(".card-simple").innerHTML =
    `<div class="simple-l1">${line1}</div>` +
    `<div class="simple-l2-row"><div class="simple-l2">${line2}</div><button class="btn-peek-detail" onclick="peekDetail(this,event)">查看詳細 ↓</button></div>` +
    (line3 ? `<div class="simple-l3">${line3}</div>` : "");
  const service = merged["服務項目"] || "";
  card.classList.toggle("is-pickup", service.includes("接機"));
  updateInvoiceBadge(card, merged);
  refreshOrdersAfterChange();
}

// ── Simple line generation ──
function formatTime24(timeStr) {
  const mins = parseMinutes(timeStr);
  if (mins === null) return timeStr || "";
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  return String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0");
}

function truncateAddr(addr) {
  if (!addr) return "";
  const result = addr.replace(/\d*[巷弄號樓].*/g, '').trim();
  return result || addr.trim();
}

function cleanAddressText(addr) {
  if (!addr) return "";
  const labels = "(?:連繫地址|聯絡地址|聯繫地址|接送地址|接送順序|接送地點|出發地址|抵達地址|目的地址|目的地|到達地址|下車地址|下車地點|送達地址|終點地址|加點地址|先到地址|地址)";
  const nextPlace = "(?:台北|臺北|新北|桃園|台中|臺中|台南|臺南|高雄|基隆|新竹|苗栗|彰化|南投|雲林|嘉義|屏東|宜蘭|花蓮|台東|臺東|澎湖|金門|連江|桃機|機場|高鐵|車站|火車站|飯店|酒店|旅館|民宿|港口|碼頭)";
  return addr
    .replace(/\r/g, "\n")
    .replace(new RegExp(`${labels}(?:[：:]|\\s+)?\\s*`, "g"), "→")
    .replace(/\s*(?:->|→|－|-|—|–|到|至|往)\s*/g, "→")
    .replace(new RegExp(`([巷弄號樓])\\s*(?=${nextPlace})`, "g"), "$1→")
    .split(/[\n→]+/)
    .map(s => s.trim())
    .filter(s => !/^0\d{7,10}$/.test(s))
    .filter(Boolean)
    .join("→");
}

function looksLikeAddressText(value) {
  if (!value) return false;
  return /(連繫地址|聯絡地址|聯繫地址|接送地址|接送順序|接送地點|出發地址|抵達地址|目的地址|目的地|到達地址|下車地址|下車地點|送達地址|終點地址|加點地址|先到地址|地址)/.test(String(value)) ||
    /[巷弄號樓].*(?:->|→|－|-|—|–|到|至|往|機場|高鐵|車站|火車站|飯店|酒店|旅館|民宿|港口|碼頭)/.test(String(value));
}

function truncateSeq(addr) {
  addr = cleanAddressText(addr);
  if (!addr) return "";
  addr = addr.replace(/(\d+[.)、．])\s*→\s*/g, "$1 ");
  const arrowParts = addr.split(/→+/).map(s => s.trim()).filter(Boolean);
  if (arrowParts.length > 1) {
    return arrowParts.map(p => truncateSeq(p)).filter(Boolean).join("→");
  }
  // Split on numbered stops like 1. 2. 3. etc, truncate each stop individually
  const stops = addr.split(/(?=\d+[.)、．])/).filter(Boolean);
  if (stops.length <= 1) return truncateAddr(addr);
  return stops.map(s => {
    const m = s.match(/^(\d+[.)、．]\s*)([\s\S]*)/);
    if (!m) return truncateAddr(s);
    return m[1] + truncateAddr(m[2]);
  }).join(" ");
}

function getTransferDestination(service) {
  if (!service) return "";
  const rules = [
    { re: /松山國內機場|松山機場|松機/, label: "松山機場" },
    { re: /基隆港/, label: "基隆港" },
    { re: /小港機場/, label: "小港機場" },
    { re: /台中機場|臺中機場/, label: "台中機場" },
    { re: /清泉崗/, label: "清泉崗" },
  ];
  const hit = rules.find(r => r.re.test(service));
  return hit ? hit.label : "";
}

function generateSimpleParts(data) {
  const time    = formatTime24(data["預約時間"] || "");
  const service = data["服務項目"] || "";
  const flight  = data["航班編號"] || "";
  const carType = data["接送車型"] || "";
  const payment = data["付費方式"] || "";
  const notes   = data["備註"] || "";
  // Collect all address fields in order, combine non-empty ones
  const addrSources = [
    truncateSeq(data["出發地址"] || ""),
    truncateSeq(data["接送地址"] || ""),
    truncateSeq(data["先到地址"] || ""),
    truncateSeq(data["接送順序"] || ""),
    truncateSeq(data["連繫地址"] || ""),
    /^[無xX]$/.test((data["加點地址"] || "").trim()) ? "" : truncateSeq(data["加點地址"] || ""),
    truncateSeq(data["抵達地址"] || ""),
    truncateSeq(data["目的地址"] || ""),
    truncateSeq(data["目的地"] || ""),
    truncateSeq(data["到達地址"] || ""),
    truncateSeq(data["下車地址"] || ""),
    truncateSeq(data["下車地點"] || ""),
    truncateSeq(data["送達地址"] || ""),
    truncateSeq(data["終點地址"] || ""),
    ...Object.entries(data)
      .filter(([key, value]) => !key.startsWith("_") && !["訂單號碼","預約日期","預約時間","服務項目","航班編號","接送車型","預約方式","乘客姓名","用車人數","行李件數","付費方式"].includes(key) && looksLikeAddressText(value))
      .map(([, value]) => truncateSeq(value || "")),
  ];
  const addrParts = addrSources
    .flatMap(part => String(part || "").split(/→+/))
    .map(s => s.trim())
    .filter(Boolean);
  // Deduplicate: skip if already contained in previous part
  const dedupedParts = [];
  addrParts.forEach(p => {
    if (!dedupedParts.some(existing => existing.includes(p) || p.includes(existing))) {
      dedupedParts.push(p);
    }
  });
  const address = dedupedParts.join("→");

  let mainPart = "";
  if (service.includes("接機")) {
    const destination = getTransferDestination(service);
    mainPart = (flight ? flight + "接機" : "接機") + (destination ? " " + destination : "") + (address ? address : "");
  } else if (service.includes("送船")) {
    const destination = getTransferDestination(service);
    mainPart = (address ? address : "") + "送船" + (destination ? " " + destination : "");
  } else if (service.includes("送機")) {
    const destination = getTransferDestination(service);
    mainPart = (address ? address : "") + "送機" + (destination ? " " + destination : "");
  } else if (service.includes("單程")) {
    mainPart = "單程" + address;
  } else {
    mainPart = service + address;
  }

  const line1 = (time ? time + " " : "") + mainPart;
  const paymentAmount = payment.replace(/下車付現|匯款預付|匯款|費用/g, '').trim();
  const paymentDisplay = paymentAmount ? "$" + paymentAmount : "";
  const line2 = [paymentDisplay, carType].filter(Boolean).join("  ");
  const line3Parts = [];
  if (notes && (notes.includes("安全椅") || notes.includes("座椅"))) line3Parts.push(notes);
  const line3 = line3Parts.join("  ");
  return { line1, line2, line3 };
}

function initSimpleLines() {
  document.querySelectorAll(".order-card").forEach(card => {
    const data = getOrderData(card);
    const { line1, line2, line3 } = generateSimpleParts(data);
    card.querySelector(".card-simple").innerHTML =
      `<div class="simple-l1">${line1}</div>` +
      `<div class="simple-l2-row"><div class="simple-l2">${line2}</div><button class="btn-peek-detail" onclick="peekDetail(this,event)">查看詳細 ↓</button></div>` +
      (line3 ? `<div class="simple-l3">${line3}</div>` : "");
  });
}

function normalizeDetailValue(value) {
  if (!value) return "";
  const labels = "(?:訂單號碼|預約日期|預約時間|服務項目|航班編號|接送車型|預約方式|乘客姓名|用車人數|行李件數|聯絡電話|連繫地址|聯絡地址|聯繫地址|接送地址|接送順序|接送地點|出發地址|抵達地址|目的地址|目的地|到達地址|下車地址|下車地點|送達地址|終點地址|加點地址|先到地址|地址|付費方式|備註)";
  return String(value)
    .replace(/\r\n?/g, "\n")
    .replace(new RegExp(`\\s+(${labels})(?:[：:]|\\s+)\\s*`, "g"), "\n$1：")
    .trim();
}

function pushDetailLine(lines, field, value) {
  const formatted = normalizeDetailValue(value);
  if (!formatted) return;
  const parts = formatted.split("\n").map(s => s.trim()).filter(Boolean);
  if (!parts.length) return;
  lines.push(`${field}：${parts[0]}`);
  parts.slice(1).forEach(part => lines.push(part));
}

const DETAIL_COPY_EXCLUDE = new Set(["created_at", "note"]);
function getDetailCopyFields(data) {
  const visible = field => field &&
    !field.startsWith("_") &&
    !DETAIL_COPY_EXCLUDE.has(field) &&
    data[field];
  const preferred = Array.isArray(data?._field_order) && data._field_order.length
    ? data._field_order
    : FIELDS_ORDER;
  const fields = preferred.filter(visible);
  Object.keys(data || {})
    .filter(field => !field.startsWith("_"))
    .filter(field => !DETAIL_COPY_EXCLUDE.has(field))
    .filter(field => data[field])
    .forEach(field => {
      if (!fields.includes(field)) fields.push(field);
    });
  return fields;
}

// ── Bulk copy / share ──
function buildBulkText(format) {
  const cards = [...document.querySelectorAll(".order-card .card-checkbox:checked")]
    .map(cb => cb.closest(".order-card"));
  const lines = [];
  cards.forEach((card, i) => {
    const data = getOrderData(card);
    const driver = card.querySelector(".driver-name").textContent.trim();
    if (format === "simple") {
      const { line1, line2, line3 } = generateSimpleParts(data);
      lines.push(line1);
      lines.push(line2);
      if (line3) lines.push(line3);
      if (driver) lines.push("司機：" + driver);
    } else {
      lines.push(`【${i+1}】`);
      getDetailCopyFields(data).forEach(f => { pushDetailLine(lines, f, data[f]); });
      if (driver) lines.push("司機：" + driver);
    }
    if (i < cards.length - 1) lines.push("");
  });
  return lines.join("\n");
}

function copySelected(format) {
  const text = buildBulkText(format);
  if (!text) return;
  const btnId = format === "simple" ? "copySimpleBtn" : "copyDetailBtn";
  const btn = document.getElementById(btnId);
  navigator.clipboard.writeText(text).then(() => {
    const orig = btn.textContent;
    btn.textContent = "已複製✓";
    setTimeout(() => { btn.textContent = orig; }, 1800);
  });
}

function shareSelected(format) {
  const text = buildBulkText(format);
  if (!text) return;
  const n = document.querySelectorAll(".order-card .card-checkbox:checked").length;
  const btnId = format === "simple" ? "shareSimpleBtn" : "shareDetailBtn";
  const btn = document.getElementById(btnId);
  if (navigator.share) {
    navigator.share({ title: `${n} 筆訂單`, text }).catch(() => {});
  } else {
    navigator.clipboard.writeText(text).then(() => {
      const orig = btn.textContent;
      btn.textContent = "已複製✓";
      setTimeout(() => { btn.textContent = orig; }, 1800);
    });
  }
}

// ── Card copy / share ──
function getCardText(card) {
  const data = getOrderData(card);
  const driver = card.querySelector(".driver-name").textContent.trim();
  if (currentView === "simple") {
    const { line1, line2, line3 } = generateSimpleParts(data);
    let text = line1 + "\n" + line2;
    if (line3) text += "\n" + line3;
    if (driver) text += "\n司機：" + driver;
    return text;
  }
  const lines = [];
  getDetailCopyFields(data).forEach(f => { pushDetailLine(lines, f, data[f]); });
  return lines.join("\n");
}

function copyCard(btn, event) {
  event.stopPropagation();

  navigator.clipboard.writeText(getCardText(card)).then(() => {
    const orig = btn.textContent;
    btn.textContent = "已複製";

    setTimeout(() => { btn.textContent = orig; btn.classList.remove("done"); }, 1800);
  });
}

function shareCard(btn, event) {

  const data = getOrderData(card);
  const text = getCardText(card);
  const title = data["訂單號碼"] || "訂單";

    navigator.share({ title, text }).catch(() => {});

    navigator.clipboard.writeText(text).then(() => {
      const orig = btn.textContent;
      btn.textContent = "已複製";
      btn.classList.add("done");
      setTimeout(() => { btn.textContent = orig; btn.classList.remove("done"); }, 1800);

}

function switchView(view, btn) {
  currentView = view;
  if (view === "simple") initSimpleLines();
  document.querySelectorAll(".btn-view[data-view]").forEach(b => b.classList.remove("active"));
  (btn || document.querySelector(`.btn-view[data-view="${view}"]`)).classList.add("active");
  document.querySelectorAll(".order-card").forEach(card => {
    const body    = card.querySelector(".card-body");
    const simple  = card.querySelector(".card-simple");
    const created = card.querySelector(".card-created");
    const note    = card.querySelector(".card-note");
    if (!body || !simple) return;
    const driver = card.querySelector(".card-driver");
    const footer = card.querySelector(".card-footer-btns");
    if (view === "simple") {
      body.classList.add("hidden");
      simple.classList.remove("hidden");
      if (created) created.style.display = "none";
      if (note) note.classList.add("hidden");
      if (driver) driver.classList.add("simple-hidden");
      if (footer) footer.classList.add("simple-hidden");
      // reset any open peek
      const peek = simple.querySelector(".btn-peek-detail");
      if (peek) peek.textContent = "查看詳細 ↓";
    } else {
      body.classList.remove("hidden");
      simple.classList.add("hidden");
      if (created) created.style.display = "";
      if (note) note.classList.remove("hidden");
      if (driver) driver.classList.remove("simple-hidden");
      if (footer) footer.classList.remove("simple-hidden");
    }
  });
}

function peekDetail(btn, event) {
  event.stopPropagation();
  const card = btn.closest(".order-card");
  const body    = card.querySelector(".card-body");
  const note    = card.querySelector(".card-note");
  const created = card.querySelector(".card-created");
  const driver  = card.querySelector(".card-driver");
  const footer  = card.querySelector(".card-footer-btns");
  const isOpen  = !body.classList.contains("hidden");
  if (isOpen) {
    body.classList.add("hidden");
    if (note) note.classList.add("hidden");
    if (created) created.style.display = "none";
    if (driver) driver.classList.add("simple-hidden");
    if (footer) footer.classList.add("simple-hidden");
    btn.textContent = "查看詳細 ↓";
  } else {
    body.classList.remove("hidden");
    if (note) note.classList.remove("hidden");
    if (created) created.style.display = "";
    if (driver) driver.classList.remove("simple-hidden");
    if (footer) footer.classList.remove("simple-hidden");
    btn.textContent = "收起 ↑";
  }
}

async function saveNote(textarea) {

  const id = card.dataset.id;
  const previous = getOrderData(card).note || "";
  const note = textarea.value.trim();

const FIELDS_ORDER = ["訂單號碼","預約日期","預約時間","服務項目","航班編號","接送車型","預約方式","乘客姓名","用車人數","行李件數","聯絡電話","連繫地址","出發地址","接送地址","先到地址","接送順序","加點地址","抵達地址","付費方式","備註"];

// Requests are cancellable so slower, older filters cannot replace newer results.
function setListBusy(busy) {
  listBusy = busy;
  const grid = document.getElementById("orderGrid");
  grid.setAttribute("aria-busy", String(busy));
  grid.inert = busy;
  document.querySelector(".toolbar").inert = busy;
  updatePagination();
}

function updatePagination() {
  document.querySelectorAll(".page-info").forEach(el => {
    el.textContent = listBusy ? "讀取中…" : `共 ${pageTotal} 筆 · 第 ${currentPage} / ${totalPages} 頁`;
  });
  document.querySelectorAll("[data-page-step]").forEach(btn => {
    btn.disabled = listBusy || (Number(btn.dataset.pageStep) < 0 ? currentPage <= 1 : currentPage >= totalPages);
  });
  document.querySelectorAll(".page-input").forEach(input => {
    input.value = currentPage;
    input.max = totalPages;
    input.disabled = listBusy;
  });
}

function changePage(step) { goToPage(currentPage + step); }

function goToPage(page) {
  const n = Number(page);
  if (!listBusy && Number.isInteger(n) && n >= 1 && n <= totalPages) {
    loadOrderPage(n);
    document.querySelector(".order-pagination").scrollIntoView({ block: "start" });
  } else {
    updatePagination();
  }
}

async function fetchOrderJson(url, controller) {
  let timedOut = false;
  const deadline = setTimeout(() => {
    timedOut = true;
    controller.abort();
  }, 25000);
  try {
    const response = await fetch(url, { signal: controller.signal, cache: "no-store" });
    const data = await response.json();
    if (!response.ok || !data.ok) throw new Error(data.error === "query_timeout" ? "request_timeout" : "load_failed");
    return data;
  } catch (err) {
    if (timedOut) throw new Error("request_timeout");
    throw err;
  } finally {
    clearTimeout(deadline);
  }
}

async function loadOrderPage(page = 1, preserveSelection = false) {
  if (listController) listController.abort();
  const controller = listController = new AbortController();
  const requestId = ++listRequestId;
  const selected = new Set(preserveSelection
    ? [...document.querySelectorAll(".card-checkbox:checked")].map(cb => cb.closest(".order-card").dataset.id)
    : []);
  currentPage = page;
  scopeCounts = null;
  setListBusy(true);
  updateCounts();
  const status = document.getElementById("listStatus");
  status.textContent = "讀取中…";
  status.classList.remove("hidden");
  document.getElementById("listRetry").classList.add("hidden");
  const params = new URLSearchParams({
    tab: currentTab, sort: currentSort, page,
    driver: currentDriverFilter,
    q: document.getElementById("searchInput").value.trim(),
    invoice: currentInvoiceFilter ? "1" : "0",
    luxury: currentLuxuryFilter ? "1" : "0",
    svc: currentSvcFilter ? "1" : "0"
  });
  if (dateRangeFrom) params.set("start", dateRangeFrom);
  if (dateRangeTo) params.set("end", dateRangeTo);
  try {
    const data = await fetchOrderJson("/api/orders?" + params, controller);
    if (requestId !== listRequestId) return;
    document.getElementById("orderGrid").innerHTML = data.html;
    currentPage = data.page;
    totalPages = data.pages;
    pageTotal = data.total;
    scopeCounts = data.counts;
    initServiceTypes();
    switchView(currentView);
    document.querySelectorAll(".order-card").forEach(card => {
      card.classList.toggle("has-driver", card.dataset.hasDriver === "yes");
      card.querySelector(".card-checkbox").checked = selected.has(card.dataset.id);
    });
    onCheckChange();
    status.textContent = data.total ? "" : "沒有符合條件的訂單";
    status.classList.toggle("hidden", data.total > 0);
  } catch (err) {
    if (err.name === "AbortError" || requestId !== listRequestId) return;
    // Stale cards must not remain editable under a different date/filter.
    document.getElementById("orderGrid").innerHTML = "";
    pageTotal = 0;
    totalPages = currentPage = 1;
    updateSelCount();
    status.textContent = err.message === "request_timeout" ? "訂單讀取逾時，請重試" : "訂單讀取失敗，請重試";
    document.getElementById("listRetry").classList.remove("hidden");
  } finally {
    if (requestId === listRequestId) {
      setListBusy(false);
      updateCounts();
    }
  }
}

async function loadDateSummary(force = false) {
  if (summaryController) summaryController.abort();
  const requestId = ++summaryRequestId;
  const sort = currentSort;
  const error = document.getElementById("summaryStatus");
  error.classList.add("hidden");
  if (!force && summaryCache[sort]) {
    dateSummaries = summaryCache[sort];
    updateCounts();
    if (currentTab === "custom") renderCalendar();
    return;
  }
  const controller = summaryController = new AbortController();
  dateSummaries = null;
  updateCounts();
  if (currentTab === "custom") renderCalendar();
  try {
    const data = await fetchOrderJson("/api/orders/summary?sort=" + sort, controller);
    if (requestId !== summaryRequestId) return;
    dateSummaries = summaryCache[sort] = data.dates;
  } catch (err) {
    if (err.name === "AbortError" || requestId !== summaryRequestId) return;
    error.classList.remove("hidden");
  } finally {
    if (requestId === summaryRequestId) {
      updateCounts();
      if (currentTab === "custom") renderCalendar();
    }
  }
}

function refreshOrdersAfterChange() {
  summaryCache = {};
  if (listController) listController.abort();
  if (summaryController) summaryController.abort();
  ++listRequestId;
  ++summaryRequestId;
  setListBusy(true);
  clearTimeout(refreshTimer);
  refreshTimer = setTimeout(() => {
    refreshTimer = null;
    loadDateSummary(true);
    loadOrderPage(currentPage, true);
  }, 80);
}

function applyFilters() {
  clearTimeout(searchTimer);
  if (refreshTimer) loadDateSummary(true);
  clearTimeout(refreshTimer);
  refreshTimer = null;
  loadOrderPage(1);
}

function queueSearch() {
  clearTimeout(searchTimer);
  if (listController) listController.abort();
  ++listRequestId;
  setListBusy(true);
  searchTimer = setTimeout(applyFilters, 300);
}

function clearSearch() {

function updateCounts() {
  const dateRows = new Map((dateSummaries || []).map(row => [row.date, row]));
  document.querySelectorAll(".date-tab-btn[data-tab]").forEach(btn => {
    const tab = btn.dataset.tab;
    let rows;
    if (tab === "custom") {
      const from = dateToNum(dateRangeFrom), to = dateToNum(dateRangeTo);
      rows = (dateSummaries || []).filter(row => {
        if (!from && !to) return false;
        if (from && to && from > to) return row.date >= from || row.date <= to;
        return (!from || row.date >= from) && (!to || row.date <= to);
      });
    } else if (tab === "all") {
      rows = dateSummaries || [];
    } else {
      rows = [dateRows.get(dateToNum(tab))].filter(Boolean);
    }
    const counts = rows.reduce((sum, row) => {
      for (const key of ["total", "invoice", "luxury", "svc"]) sum[key] += row[key];
      return sum;
    }, { total: 0, invoice: 0, luxury: 0, svc: 0 });
    const count = btn.querySelector(".tab-count");
    if (count) count.textContent = dateSummaries ? (counts.total ? `(${counts.total})` : "") : "…";
    const sub = btn.querySelector(".tab-sub");
    if (sub) sub.innerHTML = makeSubHtml(counts.invoice, counts.luxury, counts.svc);
  });
  for (const key of ["assigned", "unassigned", "invoice", "luxury", "svc"]) {
    const el = document.getElementById("cnt-" + key);
    if (el) el.textContent = scopeCounts ? `(${scopeCounts[key]})` : "…";
  }
}

function regenerateText() {
  const modalDriver = document.getElementById("driverName").value.trim();
  const orders = getSelectedOrders();
  const lines = [];
  if (modalDriver) lines.push(`司機：${modalDriver}`);
  lines.push(`共 ${orders.length} 筆訂單`);
  lines.push("─".repeat(20));
  orders.forEach((o, i) => {
    const driver = o._driver || modalDriver;
    lines.push(`【${i+1}】${o["預約日期"] || ""} ${o["預約時間"] || ""}　${o["服務項目"] || ""}`);
    if (driver) lines.push(`司機：${driver}`);
    getDetailCopyFields(o).forEach(f => {
      if (["預約日期","預約時間","服務項目"].includes(f)) return;
      pushDetailLine(lines, f, o[f]);
    });
    if (i < orders.length - 1) lines.push("─".repeat(20));
  });
  document.getElementById("shareText").value = lines.join("\n");
}

async function copyText() {

  const modalDriver = document.getElementById("driverName").value.trim();
  try {
    await navigator.clipboard.writeText(text);
    const btn = document.getElementById("copyBtn");
    btn.textContent = "已複製！";
    btn.classList.add("copied");
    setTimeout(() => { btn.textContent = "複製文字"; btn.classList.remove("copied"); }, 2000);
    if (modalDriver) {
      const cards = [...document.querySelectorAll(".order-card .card-checkbox:checked")]
        .map(cb => cb.closest(".order-card"));
      const results = await Promise.allSettled(cards.map(card => apiSetDriver(card.dataset.id, modalDriver)));
      refreshOrdersAfterChange();
      if (results.some(result => result.status === "rejected")) throw new Error("partial_save_failed");
      cards.forEach(card => {
        setCardDriver(card, modalDriver);
      });
    }
  } catch (err) {
    alert("複製或司機儲存失敗，請再試一次。");
  }
}

function parseMinutes(timeStr) {
  if (!timeStr) return null;
  let s = timeStr.replace("：", ":").trim();
  const pm = s.includes("下午");
  const am = s.includes("上午");
  s = s.replace("上午", "").replace("下午", "").trim();
  const m = s.match(/(\d{1,2})\s*:\s*(\d{2})/);
  if (!m) return null;
  let h = parseInt(m[1]), min = parseInt(m[2]);
  if (pm && h < 12) h += 12;
  if (am && h === 12) h = 0;
  return h * 60 + min;
}

function getOrderData(card) {
  try { return JSON.parse(card.querySelector(".order-data").textContent); } catch { return {}; }
}

function updateConflicts() {
  const windows = [];
  document.querySelectorAll(".order-card .card-checkbox:checked").forEach(cb => {
    const card = cb.closest(".order-card");
    const data = getOrderData(card);
    const service = data["服務項目"] || "";
    const t = parseMinutes(data["預約時間"]);
    const date = data["預約日期"] || "";
    if (t === null) return;
    if (service.includes("接機")) windows.push({ date, start: t - 30, end: t + 60 });
    else if (service.includes("送機")) windows.push({ date, start: t - 30, end: t + 30 });
  });
  document.querySelectorAll(".order-card").forEach(card => {
    const cb = card.querySelector(".card-checkbox");
    if (cb.checked) { card.classList.remove("conflict"); return; }
    const data = getOrderData(card);
    const t = parseMinutes(data["預約時間"]);
    const date = data["預約日期"] || "";
    const inConflict = t !== null && windows.some(w => w.date === date && t > w.start && t < w.end);
    card.classList.toggle("conflict", inConflict);
  });
}

function apiSetDriver(orderId, name) {
  return postJson("/api/drivers", { order_id: orderId, name: name });
}

function setCardDriver(card, name) {
  const driverDiv = card.querySelector(".card-driver");
  const footerBtns = card.querySelector(".card-footer-btns");
  if (name) {
    driverDiv.querySelector(".driver-name").textContent = name;
    driverDiv.classList.remove("hidden");
    if (footerBtns) footerBtns.style.display = "none";
    card.classList.add("has-driver");
    card.dataset.hasDriver = "yes";
  } else {
    driverDiv.classList.add("hidden");
    if (footerBtns) footerBtns.style.display = "";
    card.classList.remove("has-driver");
    card.dataset.hasDriver = "no";
  }
  refreshOrdersAfterChange();
}

async function markNoDriver(btn, event) {
  event.stopPropagation();
  const card = btn.closest(".order-card");
  try {
    const res = await apiSetDriver(card.dataset.id, "已有司機服務");
    setCardDriver(card, res.name || "已有司機服務");
  } catch (err) {
    alert("司機服務儲存失敗，請再試一次。");
  }
}

async function assignDriverBulk() {
  const cards = [...document.querySelectorAll(".order-card .card-checkbox:checked")]
    .map(cb => cb.closest(".order-card"));
  if (!cards.length) return;
  const name = prompt(`請輸入司機姓名（將指定給 ${cards.length} 筆訂單）：`);
  if (!name || !name.trim()) return;
  const driverName = name.trim();
  try {
    const results = await Promise.allSettled(cards.map(card => apiSetDriver(card.dataset.id, driverName)));
    if (results.some(result => result.status === "rejected")) throw new Error("partial_save_failed");
    cards.forEach(card => setCardDriver(card, driverName));
  } catch (err) {
    alert("批次指定司機儲存失敗，請再試一次。");
  } finally {
    refreshOrdersAfterChange();
  }
}

async function assignDriver(btn, event) {
  event.stopPropagation();
  const card = btn.closest(".order-card");
  const name = prompt("請輸入司機姓名：");
  if (name !== null && name.trim()) {
    try {
      const res = await apiSetDriver(card.dataset.id, name.trim());
      setCardDriver(card, res.name || name.trim());
    } catch (err) {
      alert("司機儲存失敗，請再試一次。");
    }
  }
}

async function editDriver(btn, event) {
  event.stopPropagation();
  const card = btn.closest(".order-card");
  const current = card.querySelector(".driver-name").textContent;
  const name = prompt("修改司機姓名：", current);
  if (name && name.trim()) {
    try {
      const res = await apiSetDriver(card.dataset.id, name.trim());
      setCardDriver(card, res.name || name.trim());
    } catch (err) {
      alert("司機儲存失敗，請再試一次。");
    }
  }
}

async function removeDriver(btn, event) {
  event.stopPropagation();
  if (!confirm("確定要移除指定司機？")) return;
  const card = btn.closest(".order-card");
  try {
    await apiSetDriver(card.dataset.id, "");
    setCardDriver(card, null);
  } catch (err) {
    alert("移除司機失敗，請再試一次。");
  }
}

function initServiceTypes() {
  document.querySelectorAll(".order-card").forEach(card => {
    const service = (getOrderData(card)["服務項目"] || "");
    if (service.includes("接機")) card.classList.add("is-pickup");
  });
}

// ── Sort ──
let currentSort = "date";

function switchSort(sort, btn) {
  currentSort = sort;
  document.querySelectorAll(".btn-view.btn-sort-opt").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  loadDateSummary();
  applyFilters();
}

// Init
updateSelCount();
loadDateSummary();
loadOrderPage(1);
</script>
