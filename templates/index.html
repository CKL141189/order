<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新增訂單</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Microsoft JhengHei", Arial, sans-serif; background: #f0f2f5; color: #333; }
.container { max-width: 900px; margin: 30px auto; padding: 0 20px 60px; }

.nav-bar { display: flex; align-items: center; margin-bottom: 28px; }
.nav-bar h1 { font-size: 1.6rem; color: #2c3e50; flex: 1; text-align: center; }
.btn-nav { padding: 8px 18px; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 0.9rem; font-family: inherit; text-decoration: none; display: inline-block; transition: background 0.2s; }
.btn-nav.blue { background: #4a90e2; }
.btn-nav.blue:hover { background: #357abd; }
.btn-nav.green { background: #27ae60; }
.btn-nav.green:hover { background: #1e8449; }

.input-section { background: #fff; border-radius: 10px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
.input-section label { font-weight: bold; display: block; margin-bottom: 10px; color: #555; font-size: 1rem; }
textarea { width: 100%; height: 200px; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 0.9rem; resize: vertical; font-family: inherit; }
textarea:focus { outline: none; border-color: #4a90e2; }
.btn-row { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; align-items: center; }
button { padding: 10px 28px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.95rem; font-family: inherit; transition: background 0.2s; }
.btn-add { background: #27ae60; color: #fff; }
.btn-add:hover:not(:disabled) { background: #1e8449; }
.btn-add:disabled { background: #a8d5b5; cursor: not-allowed; }
.btn-goto { background: #4a90e2; color: #fff; }
.btn-goto:hover { background: #357abd; }
.btn-claude { background: #8e44ad; color: #fff; }
.btn-claude:hover { background: #7d3c98; }
.btn-claude:disabled { background: #c9a9d9; cursor: not-allowed; }

.result-msg { margin-top: 14px; font-size: 0.95rem; font-weight: bold; }
.result-msg.success { color: #27ae60; }
.result-msg.partial { color: #e67e22; }
.result-msg.error { color: #e74c3c; }

.failed-section { margin-top: 18px; }
.failed-section label { font-size: 0.88rem; color: #e74c3c; font-weight: bold; display: block; margin-bottom: 8px; }
.failed-item {
  background: #fff8f8; border: 1px solid #f5c6cb; border-radius: 6px;
  padding: 10px 14px; margin-bottom: 8px; font-size: 0.82rem; color: #555;
  white-space: pre-wrap; word-break: break-all; line-height: 1.6;
}
</style>
</head>
<body>
<div class="container">

  <div class="nav-bar">
    <div style="flex:1"></div>
    <h1>新增訂單</h1>
    <div style="flex:1; display:flex; justify-content:flex-end; gap:8px;">
      <a href="/orders" class="btn-nav blue">訂單列表 →</a>
      <a href="/stats" class="btn-nav green">統計</a>
      <a href="/failed" class="btn-nav" style="background:#e74c3c;">失敗記錄</a>
      <button class="btn-nav btn-claude" id="claudeBtn" onclick="sendToClaude()">傳給 Claude 修復</button>
    </div>
  </div>

  <div class="input-section">
    <label>貼上訂單資訊（可一次貼入多筆）</label>
    <textarea id="pasteArea" placeholder="貼上訂單文字，系統將自動解析並新增至訂單列表"></textarea>
    <div class="btn-row">
      <button type="button" class="btn-add" id="addBtn" onclick="addOrders()">新增訂單</button>
      <button type="button" class="btn-claude" id="sendBtn" onclick="sendContent()">傳給 Claude</button>
      <button type="button" class="btn-goto" id="gotoBtn" onclick="window.location.href='/orders'" style="display:none">查看訂單列表 →</button>
    </div>
    <div class="result-msg" id="resultMsg"></div>
    <div class="failed-section" id="failedSection" style="display:none">
      <label id="failedLabel"></label>
      <div id="failedList"></div>
    </div>
  </div>

</div>
<script>
async function addOrders() {
  const text = document.getElementById('pasteArea').value.trim();
  if (!text) { window.location.href = '/orders'; return; }
  const btn = document.getElementById('addBtn');
  const resultMsg = document.getElementById('resultMsg');
  btn.disabled = true; btn.textContent = '解析中…';
  resultMsg.textContent = ''; resultMsg.className = 'result-msg';
  document.getElementById('failedSection').style.display = 'none';
  document.getElementById('gotoBtn').style.display = 'none';

  const parseResp = await fetch('/api/parse', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text })
  });
  const parseData = await parseResp.json();
  const orders = parseData.orders || [];
  const failed = parseData.failed || [];

  btn.disabled = false; btn.textContent = '新增訂單';

  if (!orders.length && !failed.length) {
    resultMsg.textContent = '未能解析出任何訂單，請確認格式後重試。';
    resultMsg.className = 'result-msg error';
    return;
  }

  let saved = 0;
  if (orders.length) {
    const saveResp = await fetch('/api/add_orders', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ orders })
    });
    const saveData = await saveResp.json();
    if (saveData.ok) saved = orders.length;
  }

  if (saved > 0 && failed.length === 0) {
    resultMsg.textContent = `成功新增 ${saved} 筆訂單`;
    resultMsg.className = 'result-msg success';
    document.getElementById('pasteArea').value = '';
  } else if (saved > 0 && failed.length > 0) {
    resultMsg.textContent = `成功新增 ${saved} 筆，無法解析 ${failed.length} 筆`;
    resultMsg.className = 'result-msg partial';
  } else {
    resultMsg.textContent = `無法解析 ${failed.length} 筆訂單`;
    resultMsg.className = 'result-msg error';
  }

  if (saved > 0) {
    document.getElementById('gotoBtn').style.display = '';
  }

  if (failed.length > 0) {
    document.getElementById('failedLabel').textContent = `以下 ${failed.length} 筆無法解析，請確認格式：`;
    const list = document.getElementById('failedList');
    list.innerHTML = '';
    failed.forEach(f => {
      const div = document.createElement('div');
      div.className = 'failed-item';
      div.textContent = f;
      list.appendChild(div);
    });
    document.getElementById('failedSection').style.display = '';
  }
}
async function sendContent() {
  const text = document.getElementById('pasteArea').value.trim();
  if (!text) { alert('請先貼上訂單內容。'); return; }
  const btn = document.getElementById('sendBtn');
  btn.disabled = true; btn.textContent = '傳送中…';
  const resp = await fetch('/api/claude/save', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text })
  });
  const data = await resp.json();
  btn.disabled = false;
  if (data.ok) {
    btn.textContent = '已記錄 ✓';
    setTimeout(() => btn.textContent = '傳給 Claude', 2000);
  } else {
    btn.textContent = '傳給 Claude';
    alert('記錄失敗，請重試。');
  }
}

async function sendToClaude() {
  const btn = document.getElementById('claudeBtn');
  btn.disabled = true; btn.textContent = '讀取中…';
  const resp = await fetch('/api/failed/unresolved');
  const items = await resp.json();
  btn.disabled = false; btn.textContent = '傳給 Claude 修復';
  if (!items.length) {
    alert('目前沒有未解決的解析失敗記錄。');
    return;
  }
  const text = `以下 ${items.length} 筆訂單無法解析，請幫我修復 parser：\n\n` +
    items.map((item, i) => `【第${i+1}筆】${item.created_at}\n${item.text}`).join('\n\n---\n\n');
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = `已複製 ${items.length} 筆 ✓`;
    setTimeout(() => btn.textContent = '傳給 Claude 修復', 2500);
  });
}
</script>
</body>
</html>
